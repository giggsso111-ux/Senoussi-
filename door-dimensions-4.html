  .pad{position:relative; padding:0 14px 40px}
  .toolbar{display:flex; gap:10px; margin:0 0 12px}
  .pill{flex:1; display:flex; align-items:center; justify-content:center; gap:8px; padding:11px 10px; border-radius:14px; border:1px solid rgba(255,255,255,.28);
    background:rgba(255,255,255,.12); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); color:#fff; font-weight:700; font-size:14.5px}
  .pill .ic{font-size:18px}
  .pill .ic.f{font-style:italic; font-family:Georgia,serif}
  .pill[aria-pressed=true]{background:#fff; color:var(--navy)}


  .card{background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:16px; margin-bottom:14px}
  .card h2{margin:0 0 12px; font-size:16px}

  .sizes{display:grid; grid-template-columns:1fr 124px; gap:14px; align-items:center}
  .field{margin-bottom:10px}
  .field:last-child{margin-bottom:0}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:5px}
  .field input{width:100%; padding:12px; font-size:20px; border:1px solid var(--line); border-radius:12px; background:#f8fafc; font-variant-numeric:tabular-nums; text-align:center}
  ::placeholder{color:#b3bfcb}
  #door{width:100%; height:auto; display:block}
  #door .rect{fill:#e8f1f8; stroke:var(--navy); stroke-width:2.2}
  #door .inner{fill:none; stroke:#9db6c9; stroke-width:1; stroke-dasharray:3 3}
  #door text{font-size:10.5px; fill:var(--navy); font-weight:700; font-family:inherit}
  #door .dim{stroke:var(--teal); stroke-width:1.2}

  .models{display:grid; gap:9px}
  .model{display:block; position:relative; cursor:pointer}
  .model input{position:absolute; opacity:0; top:0; left:0; width:100%; height:100%; margin:0; cursor:pointer}
  .model .box{display:flex; align-items:center; gap:12px; padding:13px 14px; border:1.5px solid var(--line); border-radius:14px; background:#fff; transition:border-color .2s, background .2s, box-shadow .2s}
  .model .dot{width:20px; height:20px; border-radius:50%; border:2px solid #b6c2cf; flex:none; transition:all .2s}
  .model .nm{flex:1; min-width:0; font-size:14.5px; font-weight:600; text-align:start}
  .model .nm bdi{display:block; direction:ltr; text-align:start; unicode-bidi:isolate}
  .tag{flex:none; font-size:12px; font-weight:700; padding:3px 9px; border-radius:20px; background:#eaf0f6; color:var(--navy)}
  .model input:checked + .box{border-color:var(--teal); background:#effaf8; box-shadow:0 0 0 3px rgba(15,127,120,.12)}
  .model input:checked + .box .dot{border-color:var(--teal); background:var(--teal); box-shadow:inset 0 0 0 4px #effaf8}
  .model input:checked + .box .tag{background:var(--teal); color:#fff}
  .model input:focus-visible + .box{outline:3px solid #7cc7c2; outline-offset:2px}

  .hint{text-align:center; color:#c3d2e0; font-size:14.5px; padding:22px 10px}
  .res-head{display:flex; align-items:center; gap:10px; margin:6px 2px 12px; font-size:14px; color:#b8c8d8}
  .res-head bdi{direction:ltr; font-weight:700; color:#fff; flex:1; text-align:start; unicode-bidi:isolate}
  .tcard{
    background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:14px 14px 12px; margin-bottom:12px;
    border-inline-start:5px solid var(--c, var(--navy));
    opacity:0; transform:translateY(-16px); animation:drop .5s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:calc(var(--i) * 95ms);
  }
  @keyframes drop{to{opacity:1; transform:none}}
  .tcard h3{margin:0 0 10px; font-size:15px}
  .tcard h3 bdi{unicode-bidi:isolate}
  .cells{display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); gap:8px}
  .cell{background:#f6f9fb; border-radius:12px; padding:9px 10px; text-align:center; min-width:0}
  .cell .lab{font-size:12px; color:var(--muted); line-height:1.35; min-height:32px; display:flex; align-items:center; justify-content:center}
  .cell .val{display:block; font-size:25px; font-weight:800; color:var(--navy); font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate; transition:color .2s}
  .cell .val.neg{color:var(--red)}
  .cell .val.tick{animation:tick .35s ease}
  @keyframes tick{0%{transform:scale(1.12); color:var(--teal)}100%{transform:none}}
  .cell .eq{display:none; font-size:11px; color:#7d8b99; margin-top:2px}
  body.eqon .cell .eq{display:block}
  .warn{background:#fdecee; color:#8d2330; border-radius:12px; padding:10px 12px; font-size:13.5px; margin-bottom:12px}
  .actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px}
  .btn{border:1px solid var(--line); background:#fff; border-radius:13px; padding:12px; font-weight:600}
  .btn.pri{background:var(--navy); color:#fff; border-color:var(--navy)}
  .btn.wa{background:#1f9d55; color:#fff; border-color:#1f9d55}
  .btn.danger{color:var(--red)}
  .toast{position:fixed; left:0; right:0; bottom:24px; margin:auto; width:max-content; max-width:90vw; background:#12304f; color:#fff; padding:10px 16px; border-radius:12px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:60}
  .toast.show{opacity:1}

  /* settings panel */
  .panel{position:fixed; top:0; bottom:0; left:50%; width:100%; max-width:430px; transform:translateX(-50%); background:var(--bg); z-index:40; display:flex; flex-direction:column; box-shadow:0 0 50px rgba(0,0,0,.3)}
  .phead{display:flex; align-items:center; gap:10px; padding:14px 14px; background:var(--navy); color:#fff}
  .phead h2{margin:0; font-size:18px}
  .pclose{width:42px; height:42px; border-radius:12px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.14); color:#fff; font-size:20px}
  .pbody{flex:1; overflow-y:auto; padding:14px 14px 36px; -webkit-overflow-scrolling:touch}
  .pnote{margin:0 0 12px; color:var(--muted); font-size:13.5px}
  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:6px}
  .chip{flex:none; border:1.5px solid var(--line); background:#fff; border-radius:20px; padding:8px 14px; font-weight:600; font-size:13.5px; direction:ltr}
  .chip[aria-pressed=true]{background:var(--teal); border-color:var(--teal); color:#fff}
  .sec{background:#fff; border-radius:16px; box-shadow:var(--shadow); padding:12px 14px; margin-bottom:12px; border-inline-start:5px solid var(--c, var(--navy))}
  .sec h3{margin:0 0 6px; font-size:14.5px}
  .sec h3 bdi{unicode-bidi:isolate}
  .srow{display:grid; grid-template-columns:1fr 100px; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line)}
  .srow:first-of-type{border-top:none}
  .srow .t{font-size:13.5px; font-weight:600; min-width:0}
  .srow .t bdi{unicode-bidi:isolate}
  .srow .t small{display:block; color:var(--muted); font-weight:400; font-size:12px}
  .srow input{width:100%; padding:10px 6px; font-size:18px; text-align:center; border:1px solid var(--line); border-radius:11px; background:#f8fafc; font-variant-numeric:tabular-nums}
  .srow.dirty input{border-color:var(--teal); background:#effaf8}
  .srow.dirty .t::after{content:"معدّل"; display:inline-block; margin-inline-start:6px; font-size:11px; color:var(--teal); font-weight:700}

  .card,.tcard{background:rgba(255,255,255,.88); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
  .credit{margin:22px 0 4px; text-align:center; direction:ltr; color:#9fb3c8; font-size:13px; letter-spacing:.3px}
  .credit::before{content:""; display:block; width:56px; height:2px; margin:0 auto 12px; background:linear-gradient(90deg,transparent,#1de9c7,transparent)}
  .credit b{color:#fff; font-weight:700}

  @media (prefers-reduced-motion: reduce){
    .tcard{animation:none; opacity:1; transform:none}
    .cell .val.tick{animation:none}
  }
  @media print{
    body{background:#fff} .app{box-shadow:none; max-width:none; background:#fff}
    .hero,.bgfix,.toolbar,.actions,.toast,.panel,.models{display:none!important}
    .card,.tcard{background:#fff!important} .credit,.credit b{color:#000}
    .pad{margin-top:0} .pad::before{content:"أبعاد الأبواب — SLIM COOLER 300L"; display:block; font-weight:800; font-size:20px; margin-bottom:10px}
    .res-head,.hint,.res-head bdi{color:#000}
    .card,.tcard{box-shadow:none; border:1px solid #ccc; break-inside:avoid}
    .tcard{opacity:1!important; transform:none!important; animation:none!important}
  }
</style>
</head>

<div class="bgfix" aria-hidden="true"><div class="bgimg"></div></div>
<div class="app">
  <div class="hero" role="img" aria-label="برنامج أبعاد الأبواب - SLIM COOLER 300L"></div>

  <main class="pad">
    <div class="toolbar">
      <button class="pill" id="setBtn" aria-label="إعدادات الأرقام"><span class="ic">⚙</span> إعدادات الأرقام</button>
      <button class="pill" id="eqBtn" aria-pressed="false" aria-label="إظهار المعادلات"><span class="ic f">ƒ</span> المعادلات</button>
    </div>
    <section class="card">
      <div class="sizes">
        <div>
          <div class="field"><label for="inH">الارتفاع (مم)</label><input id="inH" placeholder="0" type="text" inputmode="decimal" autocomplete="off"></div>
          <div class="field"><label for="inW">العرض (مم)</label><input id="inW" placeholder="0" type="text" inputmode="decimal" autocomplete="off"></div>
        </div>
        <svg id="door" viewBox="0 0 140 150" aria-hidden="true"></svg>
      </div>
    </section>

    <section class="card">
      <h2>الموديل</h2>
      <div class="models" id="models" role="radiogroup" aria-label="الموديل"></div>
    </section>

    <section id="results" aria-live="polite">
      <div class="hint" id="hint">اختار موديل عشان الجداول تظهر.</div>
      <div id="resBox" hidden>
        <div class="res-head"><span>الموديل</span><bdi id="resName"></bdi></div>
        <div id="warn"></div>
        <div id="tables"></div>
        <div class="actions">
          <button class="btn pri" id="copyBtn">نسخ النتيجة</button>
          <button class="btn wa" id="waBtn">مشاركة واتساب</button>
          <button class="btn" id="printBtn" style="grid-column:1/-1">طباعة / حفظ PDF</button>
        </div>
      </div>
    </section>
    <footer class="credit">Prepared by <b>Senoussi Abd Elazeem</b></footer>
  </main>
</div>

<div class="panel" id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <div class="phead"><button class="pclose" id="pClose" aria-label="رجوع">→</button><h2 id="pTitle">إعدادات الأرقام</h2></div>
  <div class="pbody">
    <p class="pnote">دي الأرقام اللي بتتخصم من الارتفاع والعرض في كل جدول. اختار الموديل وعدّل الرقم، والنتيجة بتتغير على طول.</p>
    <div class="chips" id="chips" role="group" aria-label="الموديل"></div>
    <div id="pSections"></div>
    <div class="actions" style="margin-top:4px">
      <button class="btn danger" id="resetModel">رجّع أرقام الموديل ده</button>
      <button class="btn danger" id="resetAll">رجّع كل الأرقام</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============ DATA + LOGIC (tested against the original sheet) ============ */
const COLORS = {frame:'#12304f', glass:'#2b7fb8', plastic:'#7a5cc2', spacer:'#0f7f78', gasket:'#c58b2b', sticker:'#c0568a', al:'#566a7c'};
const col = (label, f, eq, p) => ({label, f, eq, p});
const T = (id, title, color, cols, extra) => ({id, title, color, cols, extra});
/* value = base dimension − number (the number is editable from settings) */
const sub = (label, base, key, def) => {
  const nm = base === 'h' ? 'الارتفاع' : 'العرض';
  return col(label, (c, P) => c[base] - P[key], P => `${nm} − ${P[key]}`, {key, def, name: nm + ' −'});
};
const pair = (id, title, color, k, a, b) => T(id, title, color, [sub('height (mm)', 'h', k + 'H', a), sub('Width (mm)', 'w', k + 'W', b)]);
const frame = () => T('frame', 'Aluminum Frame', COLORS.frame, [col('height (mm)', c => c.h, () => 'الارتفاع'), col('Width (mm)', c => c.w, () => 'العرض')]);
const glass = n => pair('glass', 'Glass', COLORS.glass, 'glass', n, n);
const spacer = n => pair('spacer', 'Spacer', COLORS.spacer, 'spacer', n, n);
const gasket = (a, b) => pair('gasket', 'Gasket', COLORS.gasket, 'gasket', a, b);
const noH = () => col('height (mm)', () => null, () => 'غير محدد في الشيت');
const stickerSimple = n => T('sticker', 'Glass Sticker', COLORS.sticker, [noH(), sub('Width (mm)', 'w', 'stickerW', n)]);

const MODELS = [
  {id:'skd', tag:'SKD', short:'SKD', name:'Assembled Curved edge Frameless SKD',
   tables:[
    frame(),
    pair('glass-out', 'Glass خارجي', COLORS.glass, 'glassOut', 6, 6),
    pair('glass-in',  'Glass داخلي', COLORS.glass, 'glassIn', 74, 74),
    T('plastic', 'قطاع بلاستيك', COLORS.plastic, [sub('جنب', 'h', 'plasticSide', 64), sub('top', 'w', 'plasticTop', 124), sub('BOTTOM', 'w', 'plasticBottom', 4)]),
    spacer(97),
    gasket(20, 20),
    T('sticker', 'Glass Sticker', COLORS.sticker, [
      col('مقاس ليد الباب المقاس *2', (c, P) => (c.h - P.gasketH) + (c.w - P.gasketW), () => 'ارتفاع Gasket + عرض Gasket'),
      col('المقاس الكلي لليد', (c, P) => ((c.h - P.gasketH) + (c.w - P.gasketW)) * P.lidMult, P => `× ${P.lidMult}`, {key:'lidMult', def:2, name:'مضاعف ×'}),
      col('height (mm)', (c, P) => P.stickerH, () => 'ثابت', {key:'stickerH', def:230, name:'قيمة ثابتة'}),
      sub('Width (mm) عدل', 'w', 'stickerWAdj', 130),
      sub('Width (mm) مقلوب', 'w', 'stickerWRev', 98)]),
    T('al', 'القطاع الألمونيوم سيلفر', COLORS.al, [
      col('الطول الكلي U (مم)', (c, P) => c.h * 2 + (c.w - P.alU), P => `الارتفاع × 2 + (العرض − ${P.alU})`, {key:'alU', def:30, name:'العرض −'}),
      col('بعد ثقب التوب هنج', (c, P) => c.h + c.w - P.alHinge, P => `الارتفاع + العرض − ${P.alHinge}`, {key:'alHinge', def:30, name:'الارتفاع + العرض −'}),
      col('عرض قطاع BOTTOM', (c, P) => c.w - P.alBottom, P => `العرض − ${P.alBottom}`, {key:'alBottom', def:9.4, name:'العرض −'})])]},
  {id:'xii-sd',  tag:'SD',  short:'XII · SD',   name:'ALUMINUM PROFILE NO XII Curved without liner (SD)',  tables:[frame(), glass(52), spacer(75),  gasket(12, 10), stickerSimple(80)]},
  {id:'xii-exd', tag:'EXD', short:'XII · EXD',  name:'ALUMINUM PROFILE NO XII Curved without liner (EXD)', tables:[frame(), glass(52), spacer(75),  gasket(12, 10), stickerSimple(80)]},
  {id:'v111',    tag:'SD',  short:'V111DF2 · SD', name:'ALUMINUM PROFILE NO V111DF2 Curved with liner (SD)', tables:[frame(), glass(70), spacer(90),  gasket(12, 10), stickerSimple(100)]},
  {id:'p50',     tag:'SD',  short:'Profile #50 · SD', name:'ALUMINUM PROFILE NO Profile #50 (SD)', tables:[frame(), glass(80), spacer(103), gasket(15, 10),
      T('sticker', 'Glass Sticker', COLORS.sticker, [noH(), sub('Width(mm) عدل', 'w', 'stickerWAdj', 107), sub('Width (mm) مقلوب', 'w', 'stickerWRev', 115)])]},
];

/* every editable number of a model, in sheet order */
function paramSpecs(m){
  const out = [];
  m.tables.forEach(t => t.cols.forEach(c => { if (c.p) out.push({key:c.p.key, def:c.p.def, name:c.p.name, label:c.label, table:t.title, color:t.color}); }));
  return out;
}
function num(s){
  const t = String(s == null ? '' : s).trim();
  if (t === '') return NaN;
  const v = parseFloat(t.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
                        .replace(/[٫،,]/g, '.').replace(/[^0-9.\-]/g, ''));
  return isFinite(v) ? v : NaN;
}
/* current numbers of a model = user's override or the sheet's default */
function resolve(m, params){
  const ov = (params && params[m.id]) || {}, P = {};
  paramSpecs(m).forEach(p => { const v = num(ov[p.key]); P[p.key] = isFinite(v) ? v : (p.def === '' ? NaN : p.def); });
  return P;
}
function context(h, w){ return {h, w}; }
/* ============ END DATA + LOGIC ============ */

const $ = id => document.getElementById(id);
const fmt = v => (v == null || !isFinite(v)) ? '—' : String(Math.round(v * 100) / 100);
const KEY = 'door-dims-v2';
let S = {h:'', w:'', model:'', eq:false, params:{}};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); } catch(e){}
if (!S.params || typeof S.params !== 'object') S.params = {};
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const curModel = () => MODELS.find(m => m.id === S.model);

/* ---------- door sketch ---------- */
function drawDoor(){
  const h = num(S.h), w = num(S.w), ok = h > 0 && w > 0;
  let rw = 56, rh = 84;
  if (ok){ const r = w / h; if (r >= 1){ rw = 88; rh = 88 / r; } else { rh = 88; rw = 88 * r; } rw = Math.max(rw, 26); rh = Math.max(rh, 26); }
  const cx = 74, cy = 84, x = cx - rw / 2, y = cy - rh / 2;
  $('door').innerHTML =
    `<rect class="rect" x="${x}" y="${y}" width="${rw}" height="${rh}" rx="5"/>
     <rect class="inner" x="${x + 6}" y="${y + 6}" width="${rw - 12}" height="${rh - 12}" rx="3"/>
     <line class="dim" x1="${x}" y1="${y - 8}" x2="${x + rw}" y2="${y - 8}"/>
     <line class="dim" x1="${x}" y1="${y - 12}" x2="${x}" y2="${y - 4}"/><line class="dim" x1="${x + rw}" y1="${y - 12}" x2="${x + rw}" y2="${y - 4}"/>
     <line class="dim" x1="${x - 8}" y1="${y}" x2="${x - 8}" y2="${y + rh}"/>
     <line class="dim" x1="${x - 12}" y1="${y}" x2="${x - 4}" y2="${y}"/><line class="dim" x1="${x - 12}" y1="${y + rh}" x2="${x - 4}" y2="${y + rh}"/>
     <text x="${cx}" y="${y - 14}" text-anchor="middle">${w > 0 ? fmt(w) : 'W'}</text>
     <text transform="translate(${x - 14} ${cy}) rotate(-90)" text-anchor="middle">${h > 0 ? fmt(h) : 'H'}</text>`;
}

/* ---------- models list ---------- */
$('models').innerHTML = MODELS.map(m =>
  `<label class="model"><input type="radio" name="model" value="${m.id}" ${S.model === m.id ? 'checked' : ''}>
   <span class="box"><span class="dot"></span><span class="nm"><bdi>${m.name}</bdi></span><span class="tag">${m.tag}</span></span></label>`).join('');

/* ---------- results ---------- */
function buildTables(){
  const m = curModel();
  $('tables').innerHTML = m.tables.map((t, i) => `
    <article class="tcard" style="--i:${i};--c:${t.color}">
      <h3><bdi>${t.title}</bdi></h3>
      <div class="cells">${t.cols.map((c, j) => `<div class="cell"><span class="lab"><bdi>${c.label}</bdi></span><b class="val" data-t="${i}" data-c="${j}">—</b><small class="eq"></small></div>`).join('')}</div>
    </article>`).join('');
}

function countUp(el, to, delay){
  cancelAnimationFrame(el._raf); clearTimeout(el._to);
  if (reduce || !isFinite(to)){ el.textContent = fmt(to); return; }
  el.textContent = '0';
  el._to = setTimeout(() => {
    const t0 = performance.now(), D = 600;
    const step = now => {
      const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(to * e);
      if (p < 1) el._raf = requestAnimationFrame(step); else el.textContent = fmt(to);
    };
    el._raf = requestAnimationFrame(step);
  }, delay);
}

function updateValues(cascade){
  const m = curModel(); if (!m) return;
  const P = resolve(m, S.params), c = context(num(S.h), num(S.w), P);
  let neg = false;
  document.querySelectorAll('#tables .val').forEach(el => {
    const col = m.tables[+el.dataset.t].cols[+el.dataset.c];
    const v = col.f(c, P), was = el.textContent, txt = fmt(v);
    el.nextElementSibling.textContent = col.eq(P);
    if (isFinite(v) && v < 0) neg = true;
    el.classList.toggle('neg', isFinite(v) && v < 0);
    if (cascade && isFinite(v)) countUp(el, v, +el.dataset.t * 95 + 180);
    else { cancelAnimationFrame(el._raf); clearTimeout(el._to); el.textContent = txt;
      if (!cascade && was !== txt && was !== '—'){ el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick'); } }
  });
  $('warn').innerHTML = neg ? '<div class="warn">فيه قيم سالبة: المقاس صغير على الموديل ده، راجع الارتفاع والعرض.</div>' : '';
}

function showModel(cascade){
  const m = curModel();
  $('hint').hidden = !!m; $('resBox').hidden = !m;
  if (!m) return;
  $('resName').textContent = m.name;
  buildTables(); updateValues(cascade);
}

/* ---------- settings panel ---------- */
let setModel = null;
const effText = (m, p) => { const o = (S.params[m.id] || {})[p.key]; return o !== undefined ? o : (p.def === '' ? '' : String(p.def)); };
function renderSettings(){
  const m = MODELS.find(x => x.id === setModel);
  $('chips').innerHTML = MODELS.map(x => `<button class="chip" data-m="${x.id}" aria-pressed="${x.id === setModel}">${x.short}</button>`).join('');
  const groups = [];
  paramSpecs(m).forEach(p => { let g = groups.find(x => x.table === p.table); if (!g){ g = {table:p.table, color:p.color, rows:[]}; groups.push(g); } g.rows.push(p); });
  $('pSections').innerHTML = groups.map(g => `<section class="sec" style="--c:${g.color}"><h3><bdi>${g.table}</bdi></h3>` + g.rows.map(p => {
    const dirty = ((S.params[m.id] || {})[p.key]) !== undefined;
    return `<div class="srow ${dirty ? 'dirty' : ''}"><div class="t"><bdi>${p.label}</bdi>${p.name ? `<small>${p.name}</small>` : ''}</div>
      <input data-key="${p.key}" type="text" inputmode="decimal" autocomplete="off" placeholder="${p.def === '' ? '0' : p.def}" value="${effText(m, p)}" aria-label="${p.table} ${p.label}"></div>`;
  }).join('') + '</section>').join('');
}
function openPanel(id){
  setModel = id || S.model || MODELS[0].id; renderSettings();
  $('panel').hidden = false; document.body.style.overflow = 'hidden'; $('pClose').focus();
}
function closePanel(){ $('panel').hidden = true; document.body.style.overflow = ''; $('setBtn').focus(); }
$('setBtn').onclick = () => openPanel();
$('pClose').onclick = closePanel;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('panel').hidden) closePanel(); });
$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b){ setModel = b.dataset.m; renderSettings(); } });
$('pSections').addEventListener('input', e => {
  const key = e.target.dataset.key; if (!key) return;
  const m = MODELS.find(x => x.id === setModel), spec = paramSpecs(m).find(p => p.key === key);
  const txt = e.target.value.trim(), v = num(txt);
  const ov = S.params[m.id] || (S.params[m.id] = {});
  if (txt === '' || !isFinite(v) || (spec.def !== '' && v === spec.def)) delete ov[key]; else ov[key] = txt;
  if (!Object.keys(ov).length) delete S.params[m.id];
  e.target.closest('.srow').classList.toggle('dirty', (S.params[m.id] || {})[key] !== undefined);
  save(); if (curModel() && curModel().id === m.id) updateValues(false);
});
$('pSections').addEventListener('change', e => {      // on leaving the box, show the number really used
  const key = e.target.dataset.key; if (!key) return;
  const m = MODELS.find(x => x.id === setModel); e.target.value = effText(m, paramSpecs(m).find(p => p.key === key));
});
$('resetModel').onclick = () => { if (confirm('ترجّع أرقام الموديل ده للأرقام الأصلية في الشيت؟')){ delete S.params[setModel]; save(); renderSettings(); updateValues(false); toast('اتّرجعت الأرقام الأصلية'); } };
$('resetAll').onclick = () => { if (confirm('ترجّع كل الأرقام في كل الموديلات للأرقام الأصلية؟')){ S.params = {}; save(); renderSettings(); updateValues(false); toast('اتّرجعت كل الأرقام الأصلية'); } };

/* ---------- main events ---------- */
[['inH','h'],['inW','w']].forEach(([id, k]) => $(id).addEventListener('input', e => {
  S[k] = e.target.value; save(); drawDoor(); updateValues(false);
}));
$('models').addEventListener('change', e => {
  if (!e.target.matches('input')) return;
  S.model = e.target.value; save(); showModel(true);
  setTimeout(() => { try { $('results').scrollIntoView({behavior:'smooth', block:'start'}); } catch(err){ $('results').scrollIntoView(); } }, 60);
});
$('eqBtn').addEventListener('click', () => {
  S.eq = !S.eq; save(); document.body.classList.toggle('eqon', S.eq); $('eqBtn').setAttribute('aria-pressed', S.eq);
});

/* ---------- share ---------- */
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
function summary(){
  const m = curModel(), P = resolve(m, S.params), c = context(num(S.h), num(S.w), P);
  const L = [`أبعاد الباب: الارتفاع ${fmt(c.h)} × العرض ${fmt(c.w)} مم`, `الموديل: ${m.name}`, ''];
  m.tables.forEach(t => L.push(`${t.title}: ` + t.cols.map(k => `${k.label.trim()} = ${fmt(k.f(c, P))}`).join(' | ')));
  return L.join('\n');
}
$('copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(summary()); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = summary(); document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('تم نسخ النتيجة');
};
$('waBtn').onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent(summary()), '_blank');
$('printBtn').onclick = () => window.print();

/* ---------- start ---------- */
$('inH').value = S.h; $('inW').value = S.w;
document.body.classList.toggle('eqon', !!S.eq); $('eqBtn').setAttribute('aria-pressed', !!S.eq);
drawDoor(); showModel(true);
</script>
</body>
</html>
